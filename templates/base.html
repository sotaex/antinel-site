<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{hreflang}}
<link rel="alternate" type="text/markdown" href="{{md_url}}">
<link rel="describedby" href="{{llms_url}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{canonical}}">
<meta property="og:site_name" content="{{og_site}}">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1116" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="{{css}}">
<link rel="icon" href="{{base}}/assets/favicon.svg" type="image/svg+xml">
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body>
<a class="skip" href="#main">{{skip}}</a>
<header class="site">
  <div class="wrap">
    <a class="brand" href="{{base}}{{home}}"><span class="mark" aria-hidden="true"></span>Antinel<span class="brand-sub">{{brand_sub}}</span></a>
    <a class="langswitch" href="{{base}}{{langswitch_href}}" hreflang="{{langswitch_lang}}">{{langswitch}}</a>
    <input type="checkbox" id="navtoggle" class="navtoggle" hidden>
    <label for="navtoggle" class="navbtn" aria-label="{{nav_open}}"><span></span><span></span><span></span></label>
    <nav class="mainnav" aria-label="{{nav_label}}">
{{nav}}
    </nav>
  </div>
</header>
<main id="main" class="wrap">
{{content}}
</main>
<footer class="site">
  <div class="wrap">
{{cite}}
    <p class="footer-links">{{footer_links}}</p>
  </div>
</footer>
<script src="{{base}}/assets/copy.js" defer></script>
</body>
</html>
